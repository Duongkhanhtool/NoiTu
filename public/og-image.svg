<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF5F5"/>
      <stop offset="25%" style="stop-color:#FFF0E6"/>
      <stop offset="50%" style="stop-color:#FFFDE6"/>
      <stop offset="75%" style="stop-color:#F0FFF0"/>
      <stop offset="100%" style="stop-color:#F0F8FF"/>
    </linearGradient>
    <linearGradient id="title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF7043"/>
      <stop offset="50%" style="stop-color:#AB47BC"/>
      <stop offset="100%" style="stop-color:#29B6F6"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Decorative circles -->
  <circle cx="100" cy="100" r="60" fill="#FF7043" opacity="0.1"/>
  <circle cx="1100" cy="530" r="80" fill="#29B6F6" opacity="0.1"/>
  <circle cx="1050" cy="100" r="50" fill="#66BB6A" opacity="0.1"/>
  <circle cx="150" cy="500" r="70" fill="#AB47BC" opacity="0.1"/>
  <circle cx="600" cy="80" r="40" fill="#FFCA28" opacity="0.15"/>
  <!-- Emojis -->
  <text x="180" y="200" font-size="60" opacity="0.3">🌟</text>
  <text x="950" y="180" font-size="50" opacity="0.3">🎮</text>
  <text x="120" y="450" font-size="45" opacity="0.3">🎯</text>
  <text x="1020" y="480" font-size="55" opacity="0.3">🔊</text>
  <!-- Main icon -->
  <text x="600" y="220" text-anchor="middle" font-size="100">🔗</text>
  <!-- Title -->
  <text x="600" y="340" text-anchor="middle" font-family="'Baloo 2', 'Arial Rounded MT Bold', sans-serif" font-weight="800" font-size="120" fill="url(#title)">Nối Từ</text>
  <!-- Subtitle -->
  <text x="600" y="420" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif" font-weight="500" font-size="36" fill="#666666">Trò chơi nối từ tiếng Việt có giọng nói</text>
  <!-- Tags -->
  <rect x="320" y="460" width="160" height="45" rx="22" fill="#FF7043" opacity="0.15"/>
  <text x="400" y="490" text-anchor="middle" font-family="sans-serif" font-weight="600" font-size="20" fill="#FF7043">🎤 Voice</text>
  <rect x="510" y="460" width="180" height="45" rx="22" fill="#29B6F6" opacity="0.15"/>
  <text x="600" y="490" text-anchor="middle" font-family="sans-serif" font-weight="600" font-size="20" fill="#29B6F6">🧒 Trẻ em</text>
  <rect x="720" y="460" width="160" height="45" rx="22" fill="#66BB6A" opacity="0.15"/>
  <text x="800" y="490" text-anchor="middle" font-family="sans-serif" font-weight="600" font-size="20" fill="#66BB6A">🤖 AI</text>
  <!-- Bottom branding -->
  <text x="600" y="580" text-anchor="middle" font-family="sans-serif" font-weight="400" font-size="22" fill="#999999">Chơi miễn phí trên trình duyệt web</text>
</svg>
